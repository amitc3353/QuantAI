[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# Add the tests/ rootdir to sys.path so `from conftest import X` works in
# module-level imports regardless of cwd (8 test files use this pattern;
# they were "dark" when pytest was invoked from anywhere other than tests/).
pythonpath = .
